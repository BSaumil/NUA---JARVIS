[project]
name = "nua-sovereign-client"
version = "0.1.0"
description = "NUA Sovereign Presence Mesh desktop client (Windows/macOS/Linux) -- pairs with and consumes a NUA Companion node over the authenticated Local API"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<46",
]

[project.optional-dependencies]
tray = ["pystray>=0.19,<0.20", "pillow>=10,<12"]

[project.scripts]
nua-client = "nua_client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
