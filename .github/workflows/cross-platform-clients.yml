name: Cross Platform Clients

on:
  push:
    paths:
      - "clients/windows/**"
      - "clients/ios/**"
      - ".github/workflows/cross-platform-clients.yml"
  pull_request:
    paths:
      - "clients/windows/**"
      - "clients/ios/**"
      - ".github/workflows/cross-platform-clients.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows Tauri shell
        run: cargo check --manifest-path clients/windows/src-tauri/Cargo.toml
      - name: Test Windows shell policy
        run: cargo test --manifest-path clients/windows/src-tauri/Cargo.toml
      - name: Build Windows release executable
        run: cargo build --release --manifest-path clients/windows/src-tauri/Cargo.toml
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: nua-sovereign-windows-exe
          path: clients/windows/src-tauri/target/release/nua-sovereign-windows.exe
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate --spec clients/ios/project.yml
      - name: Build iOS simulator shell
        run: xcodebuild -project clients/ios/NuaSovereign.xcodeproj -scheme NuaSovereign -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath clients/ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: nua-sovereign-ios-simulator-app
          path: clients/ios/build/Build/Products/Debug-iphonesimulator/NuaSovereign.app
          if-no-files-found: error
