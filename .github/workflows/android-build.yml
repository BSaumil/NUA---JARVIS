name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Catches the class of defect that shipped in 32887d3: a property initialiser
      # reading a member declared below it. Self-tests against that known defect first,
      # so a broken detector fails the build rather than reporting a false zero.
      - name: Forward-reference audit
        run: python3 tools/forward_ref_audit.py

      # Catches the prompt-injection firewall's structural half silently eroding: a new
      # call site constructing UserUtterance from document/vision/notification/email
      # text instead of genuine user input. Self-tests first, same discipline as above.
      - name: Injection-boundary audit
        run: python3 tools/injection_boundary_audit.py

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nua-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
